name: shop_app
description: Open-source Flutter e-commerce application with authentication, product browsing, cart, wishlist, checkout, orders, reviews, local persistence, and Appwrite integration.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cached_network_image:
  network_image:
  http:
  dartz:
  animated_text_kit:
  animations:
  cupertino_icons: ^1.0.2
  flutter_bloc: ^8.1.3
  flutter_screenutil: ^5.9.0
  flutter_staggered_animations: ^1.1.1
  get_it:
  google_sign_in:
  internet_connection_checker:
  shared_preferences:
  sizer:
  sizer_pro:
  smooth_page_indicator:
  sqflite:
  supabase_flutter: ^1.6.2
  toast:
  syncfusion_flutter_sliders: ^22.2.12
  google_maps_flutter: ^2.5.0
  geolocator:
  geocoding:
  flutter_paypal_checkout:
  appwrite: ^11.0.0
  uuid: ^4.2.1
  star_rating:
  smooth_star_rating_null_safety: ^1.0.4+2
  image_picker: ^1.0.5
  better_open_file:


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/products_images/Jackets/
    - assets/products_images/Pants/
    - assets/products_images/Shirts/
    - assets/products_images/Shorts/
    - assets/products_images/Sportwears/
    - assets/products_images/Suits/
    - assets/products_images/T-Shirts/
 
  fonts:
    - family: Bentham
      fonts:
        - asset: assets/fonts/Bentham-Regular.ttf
          weight: 700
    - family: Tiro Gurmukhi
      fonts:
        - asset: assets/fonts/TiroGurmukhi-Regular.ttf
          weight: 700
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
    - family: Tenor Sans
      fonts:
        - asset: assets/fonts/TenorSans-Regular.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          style: normal
          weight: 400
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        # - asset: asset/fonts/Poppins-Bold.ttf
        #   weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
